name: CI Pipeline  

on:
  push:
    branches: [ main ]  
  pull_request:
    branches: [ main ]  

jobs:
  check:  
    runs-on: ubuntu-latest  

    steps:
    - name: Checkout code  
      uses: actions/checkout@v4

    - name: Set up Elixir  
      uses: erlef/setup-beam@v1
      with:
        otp-version: '27'  
        elixir-version: '1.18.2'

    - name: Cache dependencies  
      uses: actions/cache@v4
      with:
        path: |
          pre_dict/deps
          pre_dict/_build
        key: ${{ runner.os }}-elixir-${{ hashFiles('pre_dict/mix.lock') }}

    - name: Install dependencies  
      working-directory: pre_dict
      run: |
        mix local.hex --force
        mix local.rebar --force
        mix deps.get

    - name: Check formatting  
      working-directory: pre_dict
      run: mix format --check-formatted

    - name: Run linting  
      working-directory: pre_dict
      run: mix credo || true

  elixir_tests:  
    runs-on: ubuntu-22.04
    needs: check  

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Elixir
      uses: erlef/setup-beam@v1
      with:
        otp-version: '27'
        elixir-version: '1.18.2'

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          pre_dict/deps
          pre_dict/_build
        key: ${{ runner.os }}-elixir-${{ hashFiles('pre_dict/mix.lock') }}

    - name: Install dependencies
      working-directory: pre_dict
      run: |
        mix local.hex --force
        mix local.rebar --force
        mix deps.get

    - name: Run Elixir tests  
      working-directory: pre_dict
      run: mix test
